version: '3.8'

services:
  redis:
    image: "redis:alpine"
    container_name: redis_db
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - devops_network

  app1:
    build: ./app1
    container_name: message_collector
    ports:
      - "5000:5000"
    depends_on:
      - redis
    networks:
      - devops_network

  app2:
    build: ./app2
    container_name: dashboard_app
    ports:
      - "5001:5001"
    depends_on:
      - redis
    networks:
      - devops_network

networks:
  devops_network:
    driver: bridge

volumes:
  redis_data: